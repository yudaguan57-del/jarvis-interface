
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111f;
  color:#d9f7ff;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:760px;
  padding:25px 18px;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header{text-align:center;padding:28px 0}
h1{
  font-size:35px;
  letter-spacing:7px;
  color:#48dfff;
  margin:0;
  text-shadow:0 0 20px #008cff;
}
.status{color:#63dba9;font-size:12px;margin-top:12px}
#messages{
  flex:1;
  overflow-y:auto;
  padding:15px 0;
}
.message{
  padding:15px;
  margin:12px 0;
  border:1px solid #164b65;
  border-radius:12px;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.bot{background:#0b2031}
.user{background:#102d40;border-color:#2386a5}
.name{font-size:11px;color:#51dafa;margin-bottom:7px}
form{display:flex;gap:8px;padding:15px 0}
input{
  flex:1;min-width:0;
  padding:15px;
  border:1px solid #2483a5;
  border-radius:10px;
  background:#0b2031;
  color:white;
  font-size:16px;
  outline:none;
}
button{
  padding:0 22px;
  border:0;
  border-radius:10px;
  background:#00a9d6;
  color:white;
  font-weight:bold;
  font-size:15px;
}
button:disabled{opacity:.5}
footer{text-align:center;color:#537b8d;font-size:11px;padding:12px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>J.A.R.V.I.S.</h1>
<div class="status">● SYSTEM ONLINE</div>
</header>

<div id="messages">
<div class="message bot">
<div class="name">J.A.R.V.I.S.</div>
お待ちしておりました。
システムを起動しました。
ご用件をどうぞ。
</div>
</div>

<form id="chatForm">
<input id="messageInput" type="text"
placeholder="JARVISに話しかける..."
autocomplete="off" required>
<button id="sendButton" type="submit">送信</button>
</form>

<footer>J.A.R.V.I.S. AI SYSTEM</footer>
</div>

<script>
const API_URL = "https://jarvis-ai.yudaguan57.workers.dev";

const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");

function addMessage(text, type){
  const box = document.createElement("div");
  box.className = "message " + type;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = type === "user" ? "YOU" : "J.A.R.V.I.S.";

  const content = document.createElement("div");
  content.textContent = text;

  box.appendChild(name);
  box.appendChild(content);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
  return content;
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const message = input.value.trim();
  if(!message || button.disabled) return;

  addMessage(message, "user");
  input.value = "";
  button.disabled = true;
  button.textContent = "...";

  const responseBox = addMessage("考えています...", "bot");

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:message
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error || data.details || "HTTP " + response.status
      );
    }

    responseBox.textContent =
      data.reply || data.error || data.details || "応答がありません。";

  }catch(error){
    responseBox.textContent =
      "JARVIS：AI接続エラー\n" + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "送信";
    input.focus();
  }
});
</script>
</body>
</html>
